<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinician Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#faf8f6;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:16px;border:1px solid #e8e0d8;padding:2.5rem;width:100%;max-width:400px;margin:1.5rem}
.logo-row{display:flex;align-items:center;gap:10px;margin-bottom:2rem;justify-content:center}
.logo-dot{width:12px;height:12px;border-radius:50%;background:#c9a882}
.logo-text{font-size:16px;font-weight:500;color:#2c2c2a}
h1{font-size:20px;font-weight:500;color:#2c2c2a;margin-bottom:6px;text-align:center}
.subtitle{font-size:13px;color:#9a8878;text-align:center;margin-bottom:2rem}
label{font-size:12px;font-weight:500;color:#9a8878;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:8px;margin-top:1.25rem}
label:first-of-type{margin-top:0}
input{width:100%;border:1px solid #e8e0d8;border-radius:10px;padding:12px 14px;font-size:14px;font-family:inherit;background:#faf8f6;color:#2c2c2a;outline:none}
input:focus{border-color:#c9a882}
.btn{width:100%;margin-top:1.5rem;padding:13px;background:#c9a882;border:none;border-radius:10px;font-size:14px;font-weight:500;color:#fff;cursor:pointer}
.btn:hover{background:#b8956f}
.btn:disabled{background:#d9cfc7;cursor:not-allowed}
.error-box{background:#fcebeb;border:1px solid #f09595;border-radius:10px;padding:1rem;font-size:13px;color:#791F1F;margin-top:1rem;display:none}
.footer{text-align:center;font-size:11px;color:#b8a898;margin-top:1.5rem}
</style>
</head>
<body>
<div class="card">
  <div class="logo-row">
    <div class="logo-dot"></div>
    <span class="logo-text">Clinic Inbox</span>
  </div>
  <h1>Staff Login</h1>
  <p class="subtitle">Sign in to access the clinician inbox</p>

  <label for="email">Email Address</label>
  <input type="email" id="email" placeholder="your@email.com">

  <label for="password">Password</label>
  <input type="password" id="password" placeholder="Your password" onkeydown="if(event.key==='Enter')login()">

  <button class="btn" id="btn" onclick="login()">Sign In</button>
  <div class="error-box" id="errorBox"></div>
  <div class="footer">Authorised staff only</div>
</div>

<script>
const API_BASE = "https://clinic-inbox-triage.onrender.com";

async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const errorBox = document.getElementById("errorBox");
  const btn = document.getElementById("btn");
  errorBox.style.display = "none";

  if(!email || !password){
    errorBox.textContent = "Please enter your email and password.";
    errorBox.style.display = "block";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Signing in...";

  try{
    const res = await fetch(API_BASE + "/auth/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({email, password})
    });
    const data = await res.json();
    if(!res.ok){ throw new Error(data.detail || "Login failed"); }

    localStorage.setItem("clinic_token", data.access_token);
    localStorage.setItem("clinic_name", data.name);
    window.location.href = "https://clinician-inbox.netlify.app/";
  }catch(e){
    errorBox.textContent = e.message;
    errorBox.style.display = "block";
    btn.disabled = false;
    btn.textContent = "Sign In";
  }
}
</script>
</body>
</html>
